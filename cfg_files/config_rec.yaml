# experiment name
note: train_rec

#project basic
task: relation

#model basic
gpu_index: 0
lr: 0.0001
batchsize: 32
epoch: 2000
worker: 8
use_sch: False

#********dataset*********#
# The path for datasets and annotations
data_folder: data

# Human36M_MOSH MPII_CLIFF COCO CrowdPose Panda JTA AGORA JTA_fitting INSTA AIC
trainset: MPII_CLIFF COCO
# 3DMPB MuPoTS Panoptic JTA AGORA GigaCrowd_train Internet_imgs MPI3DPW
testset: Panoptic

# cliff hmr cliff_hmr pose_transformer_v8  relation relation_v8
model: flow_matching_group
use_prior: False

mode: train # train/test/eval


# Use pretrain model and the corresponding path
pretrain: False
pretrain_dir: data/flow_matching_group.pkl

# The name of your training loss function
# Split different names with a single space
# e.g., KL_Loss MPJPE L1 L2
train_loss: SMPL_Loss Keyp_Loss Mesh_Loss Joint_Loss Plane_Loss  # SMPL_Loss Keyp_Loss Mesh_Loss Joint_Loss Joint_reg_Loss Skeleton_Loss Plane_Loss
test_loss: MPJPE_H36M #MPJPE #MPJPE PCK PA_MPJPE MPJPE_H36M

#visualize
viz: False
